<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <h2>GPS System</h2>
    </div>

    <ul class="nav-links">
      <li><a (click)="ira('/home')" class="nav-link">Inicio</a></li>
      <li><a (click)="ira('/beneficiarios')" class="nav-link">Beneficiarios</a></li>
      <li><a (click)="ira('/registrar-usuarios')" class="nav-link">Registrar Usuarios</a></li>
      <li><a (click)="ira('/ventas')" class="nav-link">Ventas</a></li>
    </ul>

    <div class="nav-user" *ngIf="isAuthenticated()">
      <div class="user-info">
        <span class="user-email">{{ currentUser?.email }}</span>
        <span class="user-roles" *ngIf="currentUser?.roles?.length">
          ({{ currentUser?.roles?.join(', ') }})
        </span>
      </div>
      <button (click)="logout()" class="logout-btn">
        Cerrar Sesión
      </button>
    </div>

    <div class="nav-user" *ngIf="!isAuthenticated()">
      <button (click)="ira('/login')" class="login-btn">
        Iniciar Sesión
      </button>
    </div>
  </div>
</nav>
